name: HoundDog.ai Scan

on:
  push:
    branches: [main]
  schedule:
    # Every day at 9:00 AM PST (17:00 UTC; 10:00 AM during daylight saving time).
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: Enable debug logging
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  scan:
    name: HoundDog.ai Scan
    runs-on: ubuntu-latest
    # Dependabot's runs get no secrets, so they cannot upload results.
    if: github.actor != 'dependabot[bot]'
    container:
      image: hounddogai/hounddog:4.0.0@sha256:6f07cb66bc2fac9b6bad3271aa608bb11857c7af091769b3652df7757fc1167e
    env:
      HOUNDDOG_API_KEY: ${{ secrets.HOUNDDOG_API_KEY }}
      # The scanner needs to know the branch, which a detached checkout does not name.
      HOUNDDOG_GIT_BRANCH: ${{ github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: HoundDog.ai Scan
        run: |
          # Without a key the scanner would scan without uploading the results, so fail instead.
          if [ -z "$HOUNDDOG_API_KEY" ]; then
            echo "::error::The HOUNDDOG_API_KEY secret is not set."
            exit 1
          fi
          # Scanner 4 must scan the repository root, which is not the image's working directory.
          hounddog scan "$GITHUB_WORKSPACE" ${{ inputs.debug && '--debug' || '' }}
