name: hounddog-test-typescript

services:
  server:
    image: node:26-trixie-slim
    working_dir: /app
    volumes:
      - ./server:/app
      - /app/node_modules
    environment:
      PORT: "5174"
    ports:
      - "${SERVER_PORT:-5174}:5174"
    command: sh -c "npm ci --no-fund --no-audit && npm run start"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5174/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5m
      start_interval: 2s

  client:
    image: node:26-trixie-slim
    working_dir: /app
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://server:5174
    ports:
      - "${CLIENT_PORT:-5173}:5173"
    command: sh -c "npm ci --no-fund --no-audit && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 5m
      start_interval: 2s
